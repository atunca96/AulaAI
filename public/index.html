<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('aula_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0e1a">
    <title>AulaAI — Language Learning System</title>
    <meta name="description" content="AI-powered language learning system">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;800;900&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/foundation.css?v=20260916_ui01">
    <link rel="stylesheet" href="/css/styles.css?v=20260916_ui01">
    <link rel="stylesheet" href="/css/material-sidebar-desktop-fix.css?v=20260916_sidebar03">
    <link rel="icon" type="image/png" href="/img/icon.png">
    <script src="/js/bilingual_materials.js?v=20260911_v016" defer></script>
    <script src="/js/app.js?v=20260913_quality_v18" defer></script>
    <script src="/js/material-sidebar-hotfix.js?v=20260916_sidebar03" defer></script>
    <style>
        .foreign-word { display:inline!important; cursor:pointer!important; user-select:none!important; -webkit-user-select:none!important; position:relative; color:inherit; transition:color .2s ease; }
        .foreign-word:hover { color:var(--accent)!important; box-shadow:inset 0 -1.5px 0 0 var(--accent); text-shadow:none; }
        .tap-highlight { background:var(--accent-glow)!important; border-radius:2px; transition:background .3s ease; animation:pulse-highlight 1.5s infinite; }
        @keyframes pulse-highlight { 0%{opacity:.7}50%{opacity:1}100%{opacity:.7} }
        #dict-word-title,.vocab-word-title,.study-word-title { display:inline-block!important; width:fit-content!important; font-size:20px; font-weight:700; color:var(--text-primary); border-bottom:2px solid var(--accent)!important; padding-bottom:2px; margin-bottom:12px; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; letter-spacing:-.02em; }
        .ai-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-lg); margin-top:10px; }
        .ai-explanation,.english-translation,.ai-explanation *,.english-translation * { cursor:default!important; user-select:text!important; -webkit-user-select:text!important; pointer-events:auto!important; }
        .ai-explanation .foreign-word,.english-translation .foreign-word { cursor:default!important; box-shadow:none!important; }
        .ai-explanation .foreign-word:hover,.english-translation .foreign-word:hover { color:inherit!important; }
        @keyframes dictScaleUp { from{transform:scale(.95) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1} }
        #aula-dict-popup { display:none; position:absolute; z-index:10001; width:min(520px,calc(100vw - 32px)); max-height:calc(100vh - 120px); overflow-y:auto; overflow-x:hidden; background:var(--bg-secondary); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:24px; pointer-events:auto; animation:dictScaleUp .25s cubic-bezier(.2,.8,.2,1.1); }
        .dict-meaning-item { padding:10px; border-radius:var(--radius); background:rgba(255,255,255,.02); border:1px solid var(--border); transition:.2s; }
        .dict-meaning-item:hover { background:rgba(255,255,255,.04); }
        .study-card [dir="auto"] { cursor:default; transition:color .2s; }
        .ai-explanation,.ai-explanation *,.english-translation,.english-translation * { color:inherit!important; text-decoration:none!important; }
    </style>
</head>
