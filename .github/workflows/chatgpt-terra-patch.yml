name: ChatGPT Terra bilingual assessment patch
on:
  push:
    branches: [chatgpt-terra-bilingual-assessments]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-terra-bilingual-assessments
      - name: Apply patch
        run: python scripts/chatgpt_terra_patch.py
      - name: Syntax and focused checks
        run: |
          python -m py_compile services/authoring/budget.py services/authoring/prompts.py services/ai_engine.py services/bilingual_finisher.py services/legacy/pdf_pipeline.py
          python scripts/test_terra_bilingual_regressions.py
      - name: Commit source patch
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add services/authoring/budget.py services/authoring/prompts.py services/ai_engine.py services/bilingual_finisher.py services/legacy/pdf_pipeline.py scripts/test_terra_bilingual_regressions.py
          git commit -m "fix: restore bilingual lessons and reliable unit assessments" || exit 0
          git push origin HEAD:chatgpt-terra-bilingual-assessments
