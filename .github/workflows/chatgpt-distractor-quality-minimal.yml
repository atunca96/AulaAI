name: ChatGPT distractor patch
on:
  push:
    branches: [chatgpt-distractor-quality-minimal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-distractor-quality-minimal
      - run: python scripts/chatgpt_patch_distractors.py
      - run: python -m py_compile services/assessment_validation.py services/question_contract.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add services/assessment_validation.py services/question_contract.py
          git commit -m "fix: reject weak mechanical distractors"
          git push origin HEAD:chatgpt-distractor-quality-minimal
