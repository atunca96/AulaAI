name: ChatGPT distractor quality minimal patch
on:
  push:
    branches: [chatgpt-distractor-quality-minimal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-distractor-quality-minimal
      - name: Apply surgical distractor checks
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('services/assessment_validation.py')
          s = p.read_text(encoding='utf-8')

          export_anchor = '    "instructional_prose_ratio", "out_of_scope_terms",\n]'
          export_new = '    "instructional_prose_ratio", "out_of_scope_terms",\n    "giveaway_features", "normalize_option", "mixed_spelling_variants",\n]'
          if export_anchor not in s:
              raise SystemExit('assessment export anchor not found')
          s = s.replace(export_anchor, export_new, 1)

          norm_anchor = '\n\ndef normalize_token(text: Any) -> str:\n'
          helpers = r'''

# Short orthographic/phonetic features named in the stem: 'h', «ñ», "qu".
_QUOTED_FEATURE = re.compile(r''' + 'r"""[\'\"‘’“”«»]\\s*([^\\s\'\"‘’“”«»]{1,3})\\s*[\'\"‘’“”«»]"""' + r''')
# The same feature may be named by capitalising it: "la letra H", "las letras QU".
_CAPITALISED_FEATURE = re.compile(r"(?<![^\W\d_])([^\W\d_]{1,3})(?![^\W\d_])")


def giveaway_features(item: Dict[str, Any]) -> List[str]:
    """Return a named surface feature that only the keyed option exhibits."""
    stem = str(item.get("prompt") or "")
    answer = str(item.get("answer") or "").casefold()
    if not stem or not answer:
        return []
    opts = item.get("options")
    if isinstance(opts, list) and opts:
        pool = [str(o).casefold() for o in opts if str(o).strip()]
    else:
        distractors = item.get("distractors")
        pool = [answer] + [str(d).casefold() for d in (distractors if isinstance(distractors, list) else []) if str(d).strip()]
    if len(pool) < 3:
        return []
    candidates = list(_QUOTED_FEATURE.findall(stem))
    if any(ch.islower() for ch in stem):
        candidates += [tok for tok in _CAPITALISED_FEATURE.findall(stem) if tok.isupper()]
    found = []
    for raw in candidates:
        feature = raw.casefold()
        if not feature or not all(ch.isalpha() for ch in feature):
            continue
        if feature not in answer:
            continue
        if sum(1 for option in pool if feature in option) == 1 and feature not in found:
            found.append(feature)
    return found


def normalize_option(text: Any) -> str:
    """Normalize option identity without erasing meaningful diacritics."""
    if not text:
        return ""
    value = unicodedata.normalize("NFC", str(text).strip().casefold())
    value = re.sub(r"[^\w\s]", "", value, flags=re.UNICODE)
    return re.sub(r"\s+", " ", value).strip()


def mixed_spelling_variants(options: Sequence[Any]) -> bool:
    """Catch one accent-stripped typo mixed among otherwise distinct real forms."""
    opts = [str(o).strip() for o in (options or []) if str(o).strip()]
    if len(opts) < 4 or any(len(normalize_option(o)) < 3 for o in opts):
        return False
    groups = {normalize_token(o) for o in opts}
    return 1 < len(groups) < len(opts)
'''
          if norm_anchor not in s:
              raise SystemExit('normalize_token anchor not found')
          s = s.replace(norm_anchor, helpers + norm_anchor, 1)

          replacements = {
              'keys = [normalize_token(answer)] + [normalize_token(d) for d in clean_d]': 'keys = [normalize_option(answer)] + [normalize_option(d) for d in clean_d]',
              'if normalize_token(answer) in {normalize_token(d) for d in clean_d}:': 'if normalize_option(answer) in {normalize_option(d) for d in clean_d}:',
              'opt_keys = [normalize_token(o) for o in options]': 'opt_keys = [normalize_option(o) for o in options]',
              'if normalize_token(answer) and normalize_token(answer) not in set(opt_keys):': 'if normalize_option(answer) and normalize_option(answer) not in set(opt_keys):',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'normalization anchor missing: {old}')
              s = s.replace(old, new, 1)

          translation_anchor = '    if looks_like_translation_question(stem):\n        problems.append("translation_question")\n\n'
          validation_block = '''    if looks_like_translation_question(stem):\n        problems.append("translation_question")\n\n    for feature in giveaway_features(item):\n        problems.append(f"feature_only_in_key:{feature}")\n\n    if mixed_spelling_variants(item.get("options") or ([answer] + clean_d)):\n        problems.append("mixed_spelling_variants")\n\n'''
          if translation_anchor not in s:
              raise SystemExit('translation validation anchor not found')
          s = s.replace(translation_anchor, validation_block, 1)

          drop_anchor = '    "answer_revealed_in_", "out_of_scope:",\n)'
          drop_new = '    "answer_revealed_in_", "out_of_scope:", "feature_only_in_key:",\n    "mixed_spelling_variants",\n)'
          if drop_anchor not in s:
              raise SystemExit('fatal-prefix anchor not found')
          s = s.replace(drop_anchor, drop_new, 1)
          p.write_text(s, encoding='utf-8')

          q = Path('services/question_contract.py')
          qs = q.read_text(encoding='utf-8')
          contract_anchor = '- Reject vocabulary that sounds elevated or formal but is semantically misselected in context. Superficial formality is not precision.\n'
          contract_new = contract_anchor + '- REALISTIC ERROR: every distractor must be something a learner at CEFR {level} could genuinely choose: interference, an overgeneralised rule, the right form for the wrong category, or a confusable neighbour. Never use a correct option with an accent/letter mechanically removed as a throwaway typo among otherwise real forms.\n- SHARED TRIGGER: when the stem names a spelling, sound or form feature, every option must carry that feature on the surface; otherwise the answer can be found by scanning for the named letter instead of knowing the rule.\n'
          if contract_anchor not in qs:
              raise SystemExit('question contract anchor not found')
          qs = qs.replace(contract_anchor, contract_new, 1)
          q.write_text(qs, encoding='utf-8')
          PY
      - name: Static sanity check
        run: python -m py_compile services/assessment_validation.py services/question_contract.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add services/assessment_validation.py services/question_contract.py
          git commit -m "fix: reject weak mechanical distractors"
          git push origin HEAD:chatgpt-distractor-quality-minimal
