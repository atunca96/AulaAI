name: chatgpt-optical-center-v2
on:
  push:
    branches: [chatgpt-optical-center-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-optical-center-v2
      - name: Tune short-page optical spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/css/styles.css'); s=p.read_text()
          old='body:has(> .screen.active:not(#login-screen)) { padding-bottom: 14vh; }'
          new='body:has(> .screen.active:not(#login-screen)) { padding-top: 7vh; padding-bottom: 7vh; }'
          if s.count(old)!=1: raise SystemExit(f'expected rule once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('public/index.html'); s=p.read_text()
          old='/css/styles.css?v=20260917_optical01'; new='/css/styles.css?v=20260917_optical02'
          if s.count(old)!=1: raise SystemExit(f'expected css version once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify and commit
        run: |
          git diff --check
          git diff -- public/css/styles.css public/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/styles.css public/index.html
          git commit -m "fix: tune short-page optical spacing"
          git push origin HEAD:chatgpt-optical-center-v2
