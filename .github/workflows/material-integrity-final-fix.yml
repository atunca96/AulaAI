name: Material integrity final fix

on:
  push:
    branches: [material-integrity-final-fix-3]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.head_commit.message != 'Apply final material integrity fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: material-integrity-final-fix-3
          fetch-depth: 0

      - name: Apply surgical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Unit assessments: publication invariants can remove one candidate AFTER
          # the first 10/10 completion check. Recover deterministically from already-
          # published in-unit formative MCQs, then enforce 10/10 again. No extra AI call.
          p = Path('services/ai_engine.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if len(questions) < UNIT_ASSESSMENT_COUNT:\n        with open("pipeline.log", "a", encoding="utf-8") as f:\n            f.write(f"[{datetime.now().strftime('%H:%M:%S')}] [UNIT-ASSESSMENT] '{unit_title}' "\n                    f"produced {len(questions)}/{UNIT_ASSESSMENT_COUNT}; not published.\\n")\n        return []\n\n    # Attribute each question to a topic in the unit, preferring what the model\n'''
          new = '''    if len(questions) < UNIT_ASSESSMENT_COUNT:\n        # `ai_generate_questions` checks 10/10 before its publication boundary;\n        # a structurally invalid candidate may be removed afterwards. Complete the\n        # now-published set from the unit's own already-published formative MCQs.\n        # This costs no additional provider call and cannot leak another unit.\n        try:\n            from services.publication_invariants import apply_assessment_invariants\n            from services.assessment_validation import looks_like_translation_question\n            seen_prompts = {_normalize_token(q.get("prompt", "")) for q in questions if isinstance(q, dict)}\n            for t, content in zip(usable, contents):\n                if len(questions) >= UNIT_ASSESSMENT_COUNT:\n                    break\n                for page in (content.get("pages") or []):\n                    if len(questions) >= UNIT_ASSESSMENT_COUNT:\n                        break\n                    if not isinstance(page, dict) or str(page.get("type") or "").casefold() != "mcq":\n                        continue\n                    prompt = str(page.get("prompt") or "").strip()\n                    answer = str(page.get("answer") or "").strip()\n                    if not prompt or not answer or looks_like_translation_question(prompt):\n                        continue\n                    prompt_key = _normalize_token(prompt)\n                    if not prompt_key or prompt_key in seen_prompts:\n                        continue\n                    options = list(page.get("options") or [])\n                    if not options:\n                        options = [answer] + list(page.get("distractors") or [])\n                    options = [str(o).strip() for o in options if str(o).strip()]\n                    if len(options) < 4 or answer not in options:\n                        continue\n                    candidate = {\n                        "id": _uid(), "type": "mcq", "stem_scope": "target_complete",\n                        "prompt": prompt, "answer": answer, "options": options[:4],\n                        "distractors": [o for o in options if _normalize_token(o) != _normalize_token(answer)][:3],\n                        "why": page.get("explanation") or "Correct choice based on the unit material.",\n                        "why_tr": page.get("explanation_tr") or "Ünite içeriğine göre doğru seçenek.",\n                        "topic_id": t.get("id"),\n                    }\n                    published = apply_assessment_invariants([candidate], language=language, material_language=material_language)\n                    if published:\n                        questions.append(published[0])\n                        seen_prompts.add(prompt_key)\n        except Exception as recovery_exc:\n            with open("pipeline.log", "a", encoding="utf-8") as f:\n                f.write(f"[{datetime.now().strftime('%H:%M:%S')}] [UNIT-ASSESSMENT] deterministic completion failed: {recovery_exc}\\n")\n\n    if len(questions) < UNIT_ASSESSMENT_COUNT:\n        with open("pipeline.log", "a", encoding="utf-8") as f:\n            f.write(f"[{datetime.now().strftime('%H:%M:%S')}] [UNIT-ASSESSMENT] '{unit_title}' "\n                    f"produced {len(questions)}/{UNIT_ASSESSMENT_COUNT}; not published.\\n")\n        return []\n\n    # Attribute each question to a topic in the unit, preferring what the model\n'''
          if s.count(old) != 1:
              raise SystemExit(f'unit post-publication completion patch count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Synthetic assessment topic metadata is bilingual at rest. The same
          # persisted classroom can be exported in TR or EN, so never persist only
          # the generation track's title.
          p = Path('services/legacy/pdf_pipeline.py')
          s = p.read_text(encoding='utf-8')
          old = '''        content = build_unit_assessment_content(unit["title"], questions, material_language, unit_title_tr=unit.get("title_tr"))\n        title = unit_assessment_title(unit["title"], material_language, unit_title_tr=unit.get("title_tr"))\n        with db_connection() as db:\n            existing = db.execute(\n                "SELECT id FROM topics WHERE chapter_id = ? AND type = ?",\n                (unit["chapter_id"], UNIT_ASSESSMENT_TYPE),\n            ).fetchone()\n            payload = json.dumps(content, ensure_ascii=False)\n            if existing:\n                db.execute("UPDATE topics SET title = ?, content = ? WHERE id = ?",\n                           (title, payload, existing[0]))\n            else:\n                db.execute(\n                    "INSERT INTO topics (id, chapter_id, type, title, content, sort_order) VALUES (?,?,?,?,?,?)",\n                    (_uid(), unit["chapter_id"], UNIT_ASSESSMENT_TYPE, title, payload, unit["next_sort"]),\n                )\n            db.commit()\n'''
          new = '''        content = build_unit_assessment_content(unit["title"], questions, material_language, unit_title_tr=unit.get("title_tr"))\n        title_en = unit_assessment_title(unit["title"], "en", unit_title_tr=unit.get("title_tr"))\n        title_tr = unit_assessment_title(unit["title"], "tr", unit_title_tr=unit.get("title_tr"))\n        with db_connection() as db:\n            existing = db.execute(\n                "SELECT id FROM topics WHERE chapter_id = ? AND type = ?",\n                (unit["chapter_id"], UNIT_ASSESSMENT_TYPE),\n            ).fetchone()\n            payload = json.dumps(content, ensure_ascii=False)\n            if existing:\n                db.execute("UPDATE topics SET title = ?, title_tr = ?, content = ? WHERE id = ?",\n                           (title_en, title_tr, payload, existing[0]))\n            else:\n                db.execute(\n                    "INSERT INTO topics (id, chapter_id, type, title, title_tr, content, sort_order) VALUES (?,?,?,?,?,?,?)",\n                    (_uid(), unit["chapter_id"], UNIT_ASSESSMENT_TYPE, title_en, title_tr, payload, unit["next_sort"]),\n                )\n            db.commit()\n'''
          if s.count(old) != 1:
              raise SystemExit(f'bilingual assessment metadata patch count={s.count(old)}')
          s = s.replace(old, new, 1)

          # 3) Missing IPA repair: prompt-only enforcement still left a handful of
          # blank phonetic cells. Batch every unique blank term once after lesson
          # generation, calibrated by phonetics already present in the same class.
          marker = '''        # ── PHASE 2b: UNIT ASSESSMENTS ──\n'''
          insert = '''        # ── PHASE 2a.5: PHONETIC COMPLETENESS ──\n        # Run only when generated lesson rows actually contain blank phonetics.\n        # One class-level batch is cheaper and more reliable than regenerating a\n        # whole lesson for a missing IPA cell.\n        try:\n            _repair_missing_phonetics(course_id, language)\n        except Exception as phon_err:\n            _log(f"[PHONETIC-COMPLETE] repair skipped: {phon_err}")\n\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'phase marker count={s.count(marker)}')
          s = s.replace(marker, insert + marker, 1)

          helper_marker = '''UNIT_ASSESSMENT_TYPE = "unit_assessment"\n'''
          helper = r'''def _repair_missing_phonetics(course_id, language):
    """Fill blank lesson-table phonetics in one bounded class-level batch.

    Existing non-empty transcriptions are authoritative and are never touched.
    The provider is called only when at least one real term is blank. Returned
    mappings must echo the exact term; unknown or malformed rows are ignored.
    """
    rows = []
    with db_connection() as db:
        rows = db.execute(
            "SELECT id, content FROM topics WHERE chapter_id IN (SELECT id FROM chapters WHERE course_id = ?) "
            "AND (type IS NULL OR type != ?)",
            (course_id, UNIT_ASSESSMENT_TYPE),
        ).fetchall()

    parsed = []
    missing = {}
    examples = []

    def scan_container(container):
        if not isinstance(container, list):
            return
        for entry in container:
            if not isinstance(entry, dict):
                continue
            term = str(entry.get("term") or entry.get("word") or entry.get("target") or "").strip()
            phon = str(entry.get("phonetic") or "").strip()
            if not term or not any(ch.isalpha() for ch in term):
                continue
            if phon:
                if len(examples) < 16:
                    examples.append((term, phon))
            else:
                missing.setdefault(term, [])
                missing[term].append(entry)

    for topic_id, raw in rows:
        try:
            content = json.loads(raw or "{}") if isinstance(raw, str) else (raw or {})
        except Exception:
            continue
        if not isinstance(content, dict):
            continue
        parsed.append((topic_id, content))
        for page in content.get("pages") or []:
            if not isinstance(page, dict):
                continue
            for key in ("items", "vocabulary", "words"):
                scan_container(page.get(key))

    if not missing:
        _log("[PHONETIC-COMPLETE] no blank phonetic rows.")
        return 0

    terms = list(missing)[:160]
    calibration = "\n".join(f"- {term}: {phon}" for term, phon in examples[:12]) or "(none)"
    prompt = f"""Fill missing phonetic transcriptions for a {language} language course.
Return ONLY valid JSON in this shape: {{"items":[{{"term":"EXACT INPUT TERM","phonetic":"[standard IPA]"}}]}}.
Rules: preserve each term exactly; return one item per input term; phonetic must be a pronunciation transcription, never a translation or letter name; use standard IPA; match the transcription convention shown by the existing class examples; if a term genuinely has no spoken pronunciation, return an empty string.
Existing class examples:\n{calibration}\n\nTerms missing phonetics:\n""" + "\n".join(f"- {term}" for term in terms)
    response = _call_ai(
        [{"role": "user", "content": prompt}],
        max_tokens=min(3600, 180 + 28 * len(terms)),
        temperature=0.0,
        json_mode=True,
        allow_fallback=True,
        cost_stage="phonetic_completion",
        cost_subject=f"course {course_id}",
    )
    payload = response.get("items") if isinstance(response, dict) else response
    if not isinstance(payload, list):
        _log(f"[PHONETIC-COMPLETE] provider returned no usable mapping for {len(terms)} blank terms.")
        return 0

    mapping = {}
    allowed = set(terms)
    for item in payload:
        if not isinstance(item, dict):
            continue
        term = str(item.get("term") or "").strip()
        phon = str(item.get("phonetic") or "").strip()
        if term in allowed and phon and len(phon) <= 120:
            mapping[term] = phon

    if not mapping:
        _log(f"[PHONETIC-COMPLETE] no exact-term phonetics accepted for {len(terms)} blanks.")
        return 0

    changed_topics = set()
    filled = 0
    for term, entries in missing.items():
        phon = mapping.get(term)
        if not phon:
            continue
        for entry in entries:
            if not str(entry.get("phonetic") or "").strip():
                entry["phonetic"] = phon
                filled += 1

    with db_connection() as db:
        for topic_id, content in parsed:
            before = db.execute("SELECT content FROM topics WHERE id = ?", (topic_id,)).fetchone()
            serialized = json.dumps(content, ensure_ascii=False)
            if before and before[0] != serialized:
                db.execute("UPDATE topics SET content = ? WHERE id = ?", (serialized, topic_id))
                changed_topics.add(topic_id)
        db.commit()
    _log(f"[PHONETIC-COMPLETE] filled {filled} blank row(s) across {len(changed_topics)} topic(s) in one batch call.")
    if filled:
        bump_version()
    return filled


'''
          if s.count(helper_marker) != 1:
              raise SystemExit(f'helper marker count={s.count(helper_marker)}')
          s = s.replace(helper_marker, helper + helper_marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Full production-equivalent source verification
        run: |
          python -m py_compile services/ai_engine.py services/legacy/pdf_pipeline.py
          python scripts/run_build_pipeline.py

      - name: Focused regression checks
        run: |
          python - <<'PY'
          from services.legacy.pdf_pipeline import unit_assessment_title, build_unit_assessment_content
          assert unit_assessment_title('Leisure Activities', 'en', 'Boş Zaman Aktiviteleri') == 'Unit Assessment: Leisure Activities'
          assert unit_assessment_title('Leisure Activities', 'tr', 'Boş Zaman Aktiviteleri') == 'Ünite Değerlendirmesi: Boş Zaman Aktiviteleri'
          qs=[{'prompt':'¿Qué te gusta?','answer':'Me gusta leer.','options':['Me gusta leer.','Leo gusta.','Gusta yo leer.','Me gustan leer.'],'distractors':['Leo gusta.','Gusta yo leer.','Me gustan leer.'],'why':'Correct','why_tr':'Doğru'} for _ in range(10)]
          c=build_unit_assessment_content('Leisure Activities',qs,'tr',unit_title_tr='Boş Zaman Aktiviteleri')
          assert c['pages'][0]['title'].startswith('Unit Assessment:')
          assert c['pages'][0]['title_tr'].startswith('Ünite Değerlendirmesi:')
          src=open('services/legacy/pdf_pipeline.py',encoding='utf-8').read()
          assert 'UPDATE topics SET title = ?, title_tr = ?, content = ?' in src
          assert '[PHONETIC-COMPLETE]' in src
          ai=open('services/ai_engine.py',encoding='utf-8').read()
          assert 'deterministic completion failed' in ai
          print('focused final material integrity checks: PASS')
          PY

      - name: Commit fixes
        run: |
          git config user.name "AulaAI surgical fix"
          git config user.email "actions@users.noreply.github.com"
          git add services/ai_engine.py services/legacy/pdf_pipeline.py
          git diff --cached --check
          git commit -m "Apply final material integrity fixes"
          git push origin HEAD:material-integrity-final-fix-3
