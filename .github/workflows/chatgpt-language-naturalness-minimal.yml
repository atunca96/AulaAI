name: ChatGPT language naturalness patch
on:
  push:
    branches: [chatgpt-language-naturalness-minimal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-language-naturalness-minimal
      - name: Patch material prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/material_generation_prompt.py')
          s = p.read_text(encoding='utf-8')
          anchor = '- Dialogues must sound like plausible human interaction with coherent speaker roles and register.\n'
          addition = '- Dialogue coherence is checked turn by turn: each reply must naturally answer or advance the immediately preceding utterance. Never write a target-language line whose instructional-language translation expresses a different intended meaning; if they diverge, rewrite the target-language line rather than paraphrasing the translation to hide the mismatch.\n'
          if anchor not in s:
              raise SystemExit('natural-authenticity anchor not found')
          s = s.replace(anchor, anchor + addition, 1)
          final_anchor = 'CEFR proportionality; natural dialogue; and MCQ entailment/key validity with authentic, plausible, same-category distractors.'
          final_new = 'CEFR proportionality; dialogue turn-to-turn coherence and exact semantic equivalence of each target line with both translations; and MCQ entailment/key validity with authentic, plausible, same-category distractors.'
          if final_anchor not in s:
              raise SystemExit('final same-pass anchor not found')
          s = s.replace(final_anchor, final_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - run: python -m py_compile services/material_generation_prompt.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add services/material_generation_prompt.py
          git commit -m "fix: tighten dialogue naturalness and translation fidelity"
          git push origin HEAD:chatgpt-language-naturalness-minimal
