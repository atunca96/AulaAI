name: ChatGPT pronunciation minimal patch
on:
  push:
    branches: [chatgpt-pronunciation-minimal]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-pronunciation-minimal
      - name: Apply surgical pronunciation repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/legacy/pdf_pipeline.py')
          s = p.read_text(encoding='utf-8')
          old1 = 'term = str(entry.get("term") or entry.get("word") or entry.get("target") or "").strip()'
          new1 = 'term = str(entry.get("term") or entry.get("word") or entry.get("phrase") or entry.get("sentence") or entry.get("target") or "").strip()'
          old2 = 'Preserve each term exactly. Return one item per input term. `phonetic` must be a pronunciation transcription, never a translation or a letter name. Match the IPA convention shown by the existing class examples. If a term genuinely has no spoken pronunciation, return an empty string.'
          new2 = 'Preserve each term exactly. Return one item per input term. `phonetic` must be a pronunciation transcription, never a translation or a letter name. Match the IPA convention shown by the existing class examples. Transcribe every word of a multi-word phrase, not just its first word. A form pronounced differently across accepted standard varieties is not a reason to omit it: use the variety shown by the existing class examples. Return an empty string only when the term has no spoken pronunciation or you genuinely cannot transcribe it.'
          if old1 not in s:
              raise SystemExit('headword-key anchor not found')
          if old2 not in s:
              raise SystemExit('prompt anchor not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add services/legacy/pdf_pipeline.py
          git commit -m "fix: repair missing pronunciation rows consistently"
          git push origin HEAD:chatgpt-pronunciation-minimal
