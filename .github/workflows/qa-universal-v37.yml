name: qa-universal-v37

on:
  push:
    branches: [qa-universal-v37-work, qa-speed-quality-v38, chatgpt-publication-grade-gate]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production image
        run: docker build -t aulaai-v37-qa .
      # Docker build itself runs scripts/run_build_pipeline.py, which executes
      # the complete production verification matrix, byte-compiles every runtime
      # module and imports every entry point. Historical post-build commands
      # referenced files that no longer exist and only made a green image look red.
