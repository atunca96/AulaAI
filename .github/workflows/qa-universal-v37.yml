name: qa-universal-v37

on:
  push:
    branches: [qa-universal-v37-work, qa-speed-quality-v38, chatgpt-final-publication-integrity]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production image
        run: docker build -t aulaai-v37-qa .
      - name: Re-run publication gate regression inside exact image
        run: docker run --rm aulaai-v37-qa python scripts/test_quality_gate.py
