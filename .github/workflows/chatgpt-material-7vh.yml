name: chatgpt-material-7vh
on:
  push:
    branches: [chatgpt-material-7vh]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: chatgpt-material-7vh}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/css/styles.css'); s=p.read_text()
          old='''  .dashboard-content:has(#tab-study-materials.active) .study-container,\n  .dashboard-content:has(#tab-s-study-tab.active) .study-container {\n    margin-top: 10vh;\n  }'''
          new='''  .dashboard-content:has(#tab-study-materials.active) .study-container,\n  .dashboard-content:has(#tab-s-study-tab.active) .study-container {\n    margin-top: 7vh;\n  }'''
          if s.count(old)!=1: raise SystemExit(f'material position count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          p=Path('public/index.html'); s=p.read_text()
          old='/css/styles.css?v=20260917_mobilefix04'; new='/css/styles.css?v=20260917_mobilefix05'
          if s.count(old)!=1: raise SystemExit(f'cache key count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/css/styles.css public/index.html
          git commit -m "fix: raise mobile material reader slightly"
          git push origin HEAD:chatgpt-material-7vh
