name: Final material integrity mainline
on:
  push:
    branches:
      - final-material-integrity-mainline
permissions:
  contents: write
jobs:
  verify:
    if: github.event.head_commit.message != 'Apply final mainline material integrity fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-material-integrity-mainline
          fetch-depth: 0
      - name: Install production dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Install production renderer fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-core fonts-noto-cjk
      - name: Apply patch
        run: python scripts/apply_mainline_material_integrity_fix.py
      - name: Full production-equivalent verification
        run: python scripts/run_build_pipeline.py
      - name: Focused checks
        run: |
          python - <<'PY'
          from services.legacy.pdf_pipeline import unit_assessment_title, build_unit_assessment_content
          assert unit_assessment_title('Leisure Activities', 'en', 'Boş Zaman Aktiviteleri') == 'Unit Assessment: Leisure Activities'
          assert unit_assessment_title('Leisure Activities', 'tr', 'Boş Zaman Aktiviteleri') == 'Ünite Değerlendirmesi: Boş Zaman Aktiviteleri'
          qs=[{'prompt':'¿Qué te gusta?','answer':'Me gusta leer.','options':['Me gusta leer.','Leo gusta.','Gusta yo leer.','Me gustan leer.'],'distractors':['Leo gusta.','Gusta yo leer.','Me gustan leer.'],'why':'Correct','why_tr':'Doğru'} for _ in range(10)]
          overview=build_unit_assessment_content('Leisure Activities',qs,'tr',unit_title_tr='Boş Zaman Aktiviteleri')['pages'][0]
          assert overview['title'] == 'Unit Assessment: Leisure Activities'
          assert overview['title_tr'] == 'Ünite Değerlendirmesi: Boş Zaman Aktiviteleri'
          src=open('services/legacy/pdf_pipeline.py',encoding='utf-8').read()
          assert 'UPDATE topics SET title = ?, title_tr = ?, content = ?' in src
          assert '[PHONETIC-COMPLETE]' in src
          ai=open('services/ai_engine.py',encoding='utf-8').read()
          assert 'pre-completion assessment invariants' in ai
          assert 'post-fallback assessment invariants' in ai
          print('focused mainline integrity checks: PASS')
          PY
      - name: Commit production source only
        run: |
          git config user.name "AulaAI surgical fix"
          git config user.email "actions@users.noreply.github.com"
          git add services/legacy/pdf_pipeline.py
          git diff --cached --check
          git commit -m "Apply final mainline material integrity fixes"
          git push origin HEAD:final-material-integrity-mainline