name: Surgical English material display fix

on:
  push:
    branches:
      - surgical/english-material-display-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix in-app material language selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: surgical/english-material-display-fix
          fetch-depth: 0

      - name: Patch material display language selection
        env:
          OLD_BLOCK_B64: 
          NEW_BLOCK_B64: 
        run: python -c "import os,base64,pathlib; p=pathlib.Path('public/js/app.js'); s=p.read_text(encoding='utf-8'); old=base64.b64decode(os.environ['OLD_BLOCK_B64']).decode(); new=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode(); n=s.count(old); (_ for _ in ()).throw(SystemExit(f'Expected exactly one block; found {n}')) if n != 1 else None; p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Syntax check
        run: node --check public/js/app.js

      - name: Commit surgical fix
        run: |
          git config user.name "AulaAI surgical fix"
          git config user.email "actions@users.noreply.github.com"
          git add public/js/app.js
          git diff --cached --check
          git commit -m "Fix in-app material language selection"
          git push origin HEAD:surgical/english-material-display-fix
