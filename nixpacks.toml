[phases.setup]
nixPkgs = ["python311"]
aptPkgs = ["tesseract-ocr", "tesseract-ocr-spa", "tesseract-ocr-deu", "tesseract-ocr-fra", "tesseract-ocr-ita", "tesseract-ocr-por", "tesseract-ocr-rus", "tesseract-ocr-chi-sim", "tesseract-ocr-jpn", "tesseract-ocr-ara", "tesseract-ocr-tur", "tesseract-ocr-nld", "tesseract-ocr-swe", "tesseract-ocr-kor", "tesseract-ocr-ell"]

[phases.install]
cmds = [
    "pip install --no-cache-dir --prefer-binary -r requirements.txt"
]
cacheDirectories = ["/root/.cache/pip"]

[start]
cmd = "python server.py"
